<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Grafika Malinowska</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="images/logo.png" alt="Logo">
                <p>Grafika Malinowska</p></a>
            <ul>
                <li><a href="index.html">Strona Główna</a></li>
                <li><a href="galeria.html" aria-current="page">Galeria</a></li>
                <li><a href="cennik.html">Cennik</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="gallery-wrapper">
            <h1>Galeria</h1>
            <div class="main-preview">
                <img id="currentImage" src="" alt="Praca poglądowa">
            </div>
            <div class="gallery-controls">
                <button class="gallery-btn" id="prevBtn">&lt;</button>
                <button class="gallery-btn" id="nextBtn">&gt;</button>
            </div>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img id="lightboxImg" src="" alt="Powiększony obraz">
    </div>
    
    <footer>
        <nav>
            <ul>
                <li><a href="cennik.html">Cennik</a></li>
                <li><a href="galeria.html" aria-current="page">Galeria</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
        <p>&copy; 2026 Grafika Malinowska</p>
        <p>Website design by <a href="mailto:contact@snujus.com">Snujus</a></p>
    </footer>

    <script>
        const last_index = 8;
        let images = [];
        for (let i = 1; i <= last_index; i++) {
            images.push(`${i}.png`)
        }
        
        let currentIndex = 0;

        const currentImgElement = document.getElementById('currentImage');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const thumbnailsGrid = document.getElementById('thumbnailsGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');

        function initThumbnails() {
            thumbnailsGrid.innerHTML = '';
            images.forEach((imgSrc, index) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.classList.add('thumb');
                if (index === currentIndex) thumbDiv.classList.add('active');
                
                const img = document.createElement('img');
                img.src = 'galeria/' + imgSrc;
                img.alt = 'Thumb ' + (index + 1);
                
                thumbDiv.appendChild(img);
                
                thumbDiv.addEventListener('click', () => updateGallery(index));
                thumbnailsGrid.appendChild(thumbDiv);
            });
        }

        function updateGallery(index) {
            currentIndex = index;
            currentImgElement.style.opacity = "0";
            
            setTimeout(() => {
                currentImgElement.src = 'galeria/' + images[currentIndex];
                
                if (currentImgElement.complete) {
                    currentImgElement.style.opacity = "1";
                } else {
                    currentImgElement.onload = () => {
                        currentImgElement.style.opacity = "1";
                    };
                }
            }, 100);

            const thumbs = document.querySelectorAll('.thumb');
            thumbs.forEach((t, i) => t.classList.toggle('active', i === currentIndex));
        }

        prevBtn.addEventListener('click', () =>
            updateGallery((currentIndex - 1 + images.length) % images.length)
        );

        nextBtn.addEventListener('click', () =>
            updateGallery((currentIndex + 1) % images.length)
        );

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') prevBtn.click();
            if (event.key === 'ArrowRight') nextBtn.click();
            if (event.key === 'Escape') lightbox.classList.remove('active');
        });

        currentImgElement.addEventListener('click', () => {
            lightboxImg.src = currentImgElement.src;
            lightbox.classList.add('active');
        });

        lightboxClose.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        initThumbnails();
        if (images.length > 0) {
            updateGallery(0);
        }
    </script>
</body>
</html>
