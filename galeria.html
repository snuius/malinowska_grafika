<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafika Malinowska | Galeria</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding-top: 50px;
        }

        body > .container {
            flex: 1;
        }

        .back-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .gallery-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 3rem auto;
            background-color: var(--bg-card);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-display {
            width: 100%;
            height: 400px;
            background-color: var(--bg-dark);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid var(--accent);
            cursor: zoom-in;
        }

        .main-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 20px; 
        }

        .arrow-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            padding: 0;
            background-color: transparent;
            color: var(--accent);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 600;
            border: 2px solid var(--accent);
            border-radius: 50px;
            transition: all 0.4s var(--ease);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .arrow-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            transform: translateY(100%);
            transition: transform 0.4s var(--ease);
            z-index: -1;
        }

        .arrow-btn:hover {
            color: #fff;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .arrow-btn:hover::before {
            transform: translateY(0);
        }

        .thumbnail-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            width: 100%;
        }

        .thumb {
            height: 80px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            overflow: hidden;
        }

        .thumb.active { border-color: var(--accent); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 11, 16, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 12px; }

        footer {
            text-align: center;
            padding: 2rem 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.03);
            width: 100%;
        }

        footer a {
            color: #a9b8ce;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="back-container">
            <a href="index.html" class="contact-btn">&larr; Powrót</a>
        </div>
        <h2 class="section-title">Galeria</h2>
        
        <div class="gallery-container">
            <div class="main-display" id="main-display-container">
                <img id="main-image" src="" alt="Realizacja">
            </div>
            
            <div class="controls">
                <button class="arrow-btn" id="prev-btn"><</button>
                <button class="arrow-btn" id="next-btn">></button>
            </div>

            <div class="thumbnail-grid" id="thumbnail-grid"></div>
        </div>
    </div>

    <footer>
        <div class="container">
            &copy; 2026 Grafika Malinowska. <br>
            Website design by <a href="mailto:contact@snujus.com">Snujus</a>
        </div>
    </footer>

    <div class="lightbox" id="lightbox"><img src="" alt="Powiększenie" id="lightbox-img"></div>

    <script>
        const images = ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png'];
        let currentIndex = 0;
        const mainImage = document.getElementById('main-image');
        const grid = document.getElementById('thumbnail-grid');

        function update(index) {
            currentIndex = index;
            mainImage.src = `portfolio/${images[currentIndex]}`;
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === currentIndex));
        }

        images.forEach((img, i) => {
            const div = document.createElement('div');
            div.className = `thumb ${i === 0 ? 'active' : ''}`;
            div.innerHTML = `<img src="portfolio/${img}">`;
            div.onclick = () => update(i);
            grid.appendChild(div);
        });

        update(0);
        document.getElementById('prev-btn').onclick = () => update((currentIndex - 1 + images.length) % images.length);
        document.getElementById('next-btn').onclick = () => update((currentIndex + 1) % images.length);
        document.getElementById('main-display-container').onclick = () => {
            document.getElementById('lightbox-img').src = mainImage.src;
            document.getElementById('lightbox').classList.add('active');
        };
        document.getElementById('lightbox').onclick = () => document.getElementById('lightbox').classList.remove('active');
    </script>
</body>
</html>
