<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafika Malinowska | Strona Główna</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        header { height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; }
        header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 1px; height: 80px; background: linear-gradient(to bottom, var(--accent), transparent); animation: fadeInDown 1.5s var(--ease) 0.8s both; }
        .logo-container { width: 100px; height: 100px; margin-bottom: 1.5rem; border-radius: 20px; overflow: hidden; border: 1px solid rgba(0, 242, 254, 0.3); box-shadow: 0 0 20px rgba(0, 242, 254, 0.2); animation: fadeInDown 1s var(--ease) both; background-color: var(--bg-card); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        header h1 { font-size: 4.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 1rem; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: fadeInDown 1s var(--ease) 0.1s both; }
        header p { font-size: 1.25rem; color: var(--text-muted); font-weight: 300; letter-spacing: 1px; text-transform: uppercase; animation: fadeInDown 1s var(--ease) 0.3s both; }
        section { padding: 5rem 0; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .portfolio-item { background-color: var(--bg-card); border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.03); transition: transform 0.6s var(--ease), box-shadow 0.6s var(--ease); opacity: 0; transform: translateY(40px); cursor: zoom-in; }
        .portfolio-item.visible { opacity: 1; transform: translateY(0); }
        .portfolio-item:hover { transform: translateY(-10px) scale(1.02); box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 15px var(--accent-glow); border-color: rgba(0, 242, 254, 0.3); }
        .portfolio-item img { width: 100%; height: 350px; object-fit: cover; transition: transform 0.6s var(--ease); }
        .portfolio-item:hover img { transform: scale(1.1); }
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(10, 11, 16, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.4s var(--ease); backdrop-filter: blur(5px); cursor: zoom-out; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 40px rgba(0, 242, 254, 0.15); transform: scale(0.8); transition: transform 0.4s var(--ease); object-fit: contain; }
        .lightbox.active img { transform: scale(1); }
        @media (max-width: 768px) { header h1 { font-size: 3rem; } section { padding: 4rem 0; } }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Grafika Malinowska Logo">
        </div>
        <h1>Grafika Malinowska</h1>
        <p>Creative Studio</p>
    </header>

    <div class="container">
        <section id="contact">
            <h2 class="section-title">Masz pomysł?</h2>
            <p class="section-subtitle">Omówmy Twój projekt bezpośrednio.</p>
            <div class="buttons-wrapper">
                <a href="cennik.html" class="contact-btn">Zobacz Cennik</a>
                <a href="mailto:malinowska.graphics@gmail.com" class="contact-btn">Wyślij E-mail</a>
                <a href="https://discordapp.com/users/1055216211232829580" class="contact-btn" target="_blank">Skontaktuj się przez Discord</a>
            </div>
        </section>

        <section id="portfolio">
            <h2 class="section-title">Wybrane Projekty</h2>
            <div class="portfolio-grid" id="portfolio-grid"></div>
        </section>
    </div>

    <footer>
        <div class="container">
            &copy; 2026 Grafika Malinowska. <br>
            Website design by <a href="mailto:snujus.contact@gmail.com">Snujus</a>
        </div>
    </footer>

    <div class="lightbox" id="lightbox">
        <img src="" alt="Powiększone zdjęcie" id="lightbox-img">
    </div>

    <script>
        const availableImages = ['1.png', '2.png', '3.png', '4.png'];
        const shuffled = availableImages.sort(() => 0.5 - Math.random());
        const selectedImages = shuffled.slice(0, 3);
        const portfolioGrid = document.getElementById('portfolio-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        selectedImages.forEach((imgName, index) => {
            const div = document.createElement('div');
            div.className = 'portfolio-item';
            div.style.transitionDelay = `${index * 0.15}s`; 
            const imgElement = document.createElement('img');
            imgElement.src = `portfolio/${imgName}`;
            imgElement.alt = `Realizacja ${imgName}`;
            div.appendChild(imgElement);
            portfolioGrid.appendChild(div);
            div.addEventListener('click', () => { lightboxImg.src = imgElement.src; lightbox.classList.add('active'); });
        });

        lightbox.addEventListener('click', () => { lightbox.classList.remove('active'); });
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.portfolio-item').forEach(item => observer.observe(item));
    </script>
</body>
</html>
